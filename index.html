<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Smith Pro - Fixed Edition</title>
    <style>
        :root {
            --bg-glow: linear-gradient(135deg, #0f172a, #1e1b4b);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-rose: #f43f5e;
            --neon-orange: #f97316;
            --text-light: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body {
            background: var(--bg-glow);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .arcade-container {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            padding: 25px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(6, 182, 212, 0.2); padding-bottom: 10px; }
        .header h1 { font-size: 2.2rem; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(6, 182, 212, 0.6); }
        .stats { display: flex; justify-content: space-between; font-weight: bold; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; }
        .timer-container { width: 100%; background: #334155; height: 6px; border-radius: 3px; margin: 15px 0; overflow: hidden; }
        .timer-bar { height: 100%; width: 100%; background: var(--neon-green); transition: width 1s linear, background-color 0.3s; }
        .display-box { text-align: center; margin: 25px 0; min-height: 90px; }
        .word-display { font-size: 2.4rem; font-weight: bold; letter-spacing: 4px; color: var(--neon-orange); text-shadow: 0 0 8px rgba(249, 115, 22, 0.5); }
        .hint-display { font-size: 0.85rem; color: #94a3b8; margin-top: 10px; font-style: italic; }
        input[type="text"] {
            width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid #475569; border-radius: 6px;
            color: white; font-size: 1.2rem; text-align: center; text-transform: uppercase; outline: none; letter-spacing: 2px;
        }
        input[type="text"]:focus { border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(6, 182, 212, 0.5); }
        .feedback { text-align: center; height: 24px; margin: 10px 0; font-weight: bold; font-size: 0.95rem; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            color: #0f172a; font-size: 0.95rem; transition: transform 0.1s, opacity 0.2s;
        }
        button.sub { background: var(--neon-green); }
        button.skp { background: #94a3b8; }
        button:active { transform: scale(0.98); }
        .game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; z-index: 10;
        }
        .game-over-screen h2 { color: var(--neon-rose); font-size: 2.5rem; margin-bottom: 15px; text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
        .game-over-screen p { font-size: 1.2rem; margin-bottom: 25px; }
        .game-over-screen button { max-width: 200px; background: var(--neon-cyan); color: #0f172a; }
    </style>
</head>
<body>
    <div class="arcade-container">
        <div class="header">
            <h1>WORD SMITH PRO</h1>
        </div>
        <div id="game-view">
            <div class="stats">
                <span id="score-lbl">SCORE: 0</span>
                <span id="timer-lbl">TIME: 45s</span>
            </div>
            <div class="timer-container"><div class="timer-bar" id="t-bar"></div></div>
            <div class="display-box">
                <div class="word-display" id="w-display">L O A D I N G</div>
                <div class="hint-display" id="h-display">Gathering arrays...</div>
            </div>
            <div>
                <input type="text" id="guess-input" placeholder="DECRYPT THE WORD..." autocomplete="off">
                <div class="feedback" id="fb-box"></div>
                <div class="btn-row">
                    <button class="skp" onclick="skip()">Skip</button>
                    <button class="sub" onclick="submit()">Execute</button>
                </div>
            </div>
        </div>
        <div class="game-over-screen" id="over-view" style="display: none;">
            <h2>TERMINAL HALTED</h2>
            <p id="final-score-lbl">FINAL SCORE: 0</p>
            <button onclick="restart()">Restart Engine</button>
        </div>
    </div>
    <script>
        const bank = [
            { w: "PROGRAM", h: "Instructions sequence executing operations." },
            { w: "COMPILER", h: "Translates high-level statements to raw bytecode." },
            { w: "POINTER", h: "Variable storing raw memory addresses dynamically." },
            { w: "FUNCTION", h: "Modular reusable block processing data structures." },
            { w: "VARIABLE", h: "Named system allocation container referencing values." },
            { w: "ARRAY", h: "Contiguous indexed sequence elements configuration." }
        ];
        let score = 0, idx = 0, timeLeft = 45, maxTime = 45, timerInterval;

        function shuffle(str) {
            let arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.join(' ');
        }

        function start() {
            score = 0; idx = 0; timeLeft = maxTime;
            document.getElementById('over-view').style.display = 'none';
            load();
            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
        }

        function load() {
            document.getElementById('guess-input').value = '';
            document.getElementById('fb-box').innerText = '';
            document.getElementById('score-lbl').innerText = `SCORE: ${score}`;
            let item = bank[idx % bank.length];
            document.getElementById('w-display').innerText = shuffle(item.w);
            document.getElementById('h-display').innerText = `HINT: ${item.h}`;
        }

        function tick() {
            timeLeft--;
            document.getElementById('timer-lbl').innerText = `TIME: ${timeLeft}s`;
            let pct = (timeLeft / maxTime) * 100;
            let bar = document.getElementById('t-bar');
            bar.style.width = pct + '%';
            if(timeLeft <= 10) bar.style.backgroundColor = '#f43f5e';
            else bar.style.backgroundColor = '#10b981';
            if(timeLeft <= 0) { 
                clearInterval(timerInterval); 
                document.getElementById('final-score-lbl').innerText = `FINAL SCORE: ${score}`; 
                document.getElementById('over-view').style.display = 'flex'; 
            }
        }

        function submit() {
            let val = document.getElementById('guess-input').value.trim().toUpperCase();
            let targetWord = bank[idx % bank.length].w;

            if(!val) return;

            // Strict equality check against answer target
            if(val === targetWord) {
                score += 10 + Math.max(0, Math.floor(timeLeft / 5));
                idx++;
                timeLeft = Math.min(maxTime, timeLeft + 8);
                document.getElementById('fb-box').innerText = 'CRITICAL SUCCESS!';
                document.getElementById('fb-box').style.color = '#10b981';
                setTimeout(load, 800);
            } else {
                document.getElementById('fb-box').innerText = 'INCORRECT MATCH';
                document.getElementById('fb-box').style.color = '#f43f5e';
            }
        }

        function skip() { idx++; load(); }
        function restart() { start(); }

        document.getElementById('guess-input').addEventListener('keypress', e => { 
            if(e.key === 'Enter') submit(); 
        });

        window.onload = start;
    </script>
</body>
</html>
