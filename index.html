<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordsmith - Word Scramble Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            padding: 28px;
            text-align: center;
        }
        .header h1 {
            color: #38bdf8;
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #0f172a;
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1rem;
        }
        .stats-bar div span {
            color: #38bdf8;
        }
        .scrambled-box {
            background-color: #334155;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .scrambled-text {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: #facc15;
            text-transform: uppercase;
        }
        .hint-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-top: 10px;
            font-style: italic;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-submit {
            background-color: #0284c7;
            color: #fff;
        }
        .btn-skip {
            background-color: #475569;
            color: #fff;
        }
        .message-box {
            min-height: 24px;
            font-size: 1rem;
            font-weight: 600;
        }
        .msg-success { color: #4ade80; }
        .msg-error { color: #f87171; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>WORDSMITH</h1>
        <p>Text Analysis & Word Anagram Game</p>
    </div>

    <div class="stats-bar">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="timer">30</span>s</div>
    </div>

    <div class="scrambled-box">
        <div class="scrambled-text" id="scrambled-word">WORDSMITH</div>
        <div class="hint-text" id="hint-text">Press Start to Play!</div>
    </div>

    <div class="input-group">
        <input type="text" id="user-input" placeholder="Type your guess..." disabled autocomplete="off">
    </div>

    <div class="btn-group">
        <button class="btn-submit" id="action-btn" onclick="handleAction()">Start Game</button>
        <button class="btn-skip" id="skip-btn" onclick="skipWord()" disabled>Skip</button>
    </div>

    <div class="message-box" id="message"></div>
</div>

<script>
    const wordList = [
        { word: "VARIABLE", hint: "A named storage location in memory." },
        { word: "COMPILER", hint: "Translates code into executable machine instructions." },
        { word: "POINTER", hint: "A variable that stores the memory address of another value." },
        { word: "FUNCTION", hint: "A reusable block of code designed to perform a task." },
        { word: "ALGORITHM", hint: "A step-by-step procedure for solving a problem." },
        { word: "RECURSION", hint: "When a function calls itself directly or indirectly." },
        { word: "STRUCTURE", hint: "A user-defined data type in C holding mixed variables." }
    ];

    let currentWordObj = {};
    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let gameActive = false;

    function scramble(word) {
        let arr = word.split('');
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        let scrambled = arr.join('');
        return scrambled === word ? scramble(word) : scrambled;
    }

    function handleAction() {
        if (!gameActive) {
            startGame();
        } else {
            checkGuess();
        }
    }

    function startGame() {
        score = 0;
        timeLeft = 30;
        gameActive = true;
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('action-btn').innerText = "Submit";
        document.getElementById('user-input').disabled = false;
        document.getElementById('skip-btn').disabled = false;
        document.getElementById('message').innerText = "";
        
        nextWord();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function nextWord() {
        const randomIndex = Math.floor(Math.random() * wordList.length);
        currentWordObj = wordList[randomIndex];
        document.getElementById('scrambled-word').innerText = scramble(currentWordObj.word);
        document.getElementById('hint-text').innerText = "Hint: " + currentWordObj.hint;
        document.getElementById('user-input').value = "";
        document.getElementById('user-input').focus();
    }

    function checkGuess() {
        const input = document.getElementById('user-input').value.trim().toUpperCase();
        const msg = document.getElementById('message');
        if (input === currentWordObj.word) {
            score += 10;
            document.getElementById('score').innerText = score;
            msg.className = "message-box msg-success";
            msg.innerText = "Correct! +10 Points";
            nextWord();
        } else {
            msg.className = "message-box msg-error";
            msg.innerText = "Try again!";
        }
    }

    function skipWord() {
        if (!gameActive) return;
        document.getElementById('message').className = "message-box";
        document.getElementById('message').innerText = "Skipped!";
        nextWord();
    }

    function endGame() {
        clearInterval(timerInterval);
        gameActive = false;
        document.getElementById('user-input').disabled = true;
        document.getElementById('skip-btn').disabled = true;
        document.getElementById('action-btn').innerText = "Play Again";
        document.getElementById('scrambled-word').innerText = "GAME OVER";
        document.getElementById('hint-text').innerText = "Final Score: " + score;
        document.getElementById('message').innerText = "";
    }
</script>

</body>
</html>
